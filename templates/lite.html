<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaTDSEQ KIOSK</title>
    <style>
        body { 
            background-color: #000000; 
            color: #ff9900; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-variant-numeric: tabular-nums;
            margin: 0; padding: 10px 20px; font-size: 13px;
            height: 100vh; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column;
        }
        .top-bar { display: flex; justify-content: space-between; border-bottom: 2px solid #333; padding-bottom: 5px; align-items: flex-end; }
        .top-bar h1 { margin: 0; font-size: 24px; color: #ffb84d; letter-spacing: 0.5px; font-weight: 600; text-transform: uppercase;}
        .hw-stats { font-size: 13px; font-weight: bold; color: #888; text-transform: uppercase; }
        .hw-stats span { color: #00ff00; margin-left: 5px; margin-right: 15px;}
        
        #btc-price-container { text-align: center; margin: 10px 0 15px 0; }
        #btc-price { color: #00ff00; font-size: 75px; font-weight: 700; text-shadow: 0 0 25px rgba(0, 255, 0, 0.4); line-height: 1; margin: 0; font-family: -apple-system, sans-serif;}
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.7; } }
        
        #macro-context { text-align: center; margin-bottom: 15px; font-size: 15px; color: #888; font-weight: 600;}
        
        .content-wrapper { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; }
        
        .bot-card { border: 1px solid #333; background: #080808; display: flex; flex-direction: column; border-radius: 4px;}
        .bot-header { font-size: 15px; font-weight: 600; background: #151515; padding: 8px 12px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; color: #ffb84d; border-top-left-radius: 4px; border-top-right-radius: 4px;}
        .status-badge { padding: 3px 6px; font-size: 11px; color: #000; font-weight: bold; border-radius: 3px; }
        .status-active { background-color: #00ff00; box-shadow: 0 0 10px rgba(0,255,0,0.5);}
        .status-idle { background-color: #ffb84d; }
        .status-offline { background-color: #ff3333; }
        
        .bot-body { padding: 10px 15px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px solid #1a1a1a; padding-bottom: 3px;}
        .row:last-child { border-bottom: none; }
        .label { color: #888; font-size: 12px; font-weight: 500;}
        .value { font-weight: 600; color: #fff; font-size: 12px;}
        .val-green { color: #00ff00; }
        .val-red { color: #ff3333; }
        .val-blue { color: #4dc3ff; }
        
        .trades-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; flex: 1; margin-top: 2px;}
        .trade-card { border: 1px dashed #333; background: #050505; padding: 10px; display: flex; flex-direction: column; border-radius: 4px;}
        .trade-header { font-size: 13px; color: #999; border-bottom: 1px solid #222; margin-bottom: 8px; text-align: center; padding-bottom: 5px; font-weight: 600;}
        .trade-row { display: flex; justify-content: space-between; font-size: 12px; border-bottom: 1px dotted #151515; padding: 4px 0; font-weight: 500;}
        .trade-row:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>GaTDSEQ</h1>
        <div class="hw-stats">
            CPU: <span id="sys-cpu">--%</span>
            RAM: <span id="sys-ram">--%</span>
            TEMP: <span id="sys-temp">--°C</span>
        </div>
    </div>

    <div id="btc-price-container">
        <div id="btc-price" class="blink">LOADING...</div>
    </div>
    
    <div id="macro-context">
        GLOBAL EQUITY: <span id="global-equity" class="val-green">LOADING...</span> &nbsp;&nbsp;|&nbsp;&nbsp; 
        FEAR & GREED: <span id="fng-index" class="val-blue">LOADING...</span>
    </div>

    <div class="content-wrapper">
        <div class="grid" id="fleet-grid"></div>
        <div class="trades-grid" id="trades-grid"></div>
    </div>

    <script>
        async function fetchSystem() {
            try {
                let res = await fetch('/api/system');
                let data = await res.json();
                document.getElementById('sys-cpu').innerText = `${data.cpu}%`;
                document.getElementById('sys-ram').innerText = `${data.ram}%`;
                document.getElementById('sys-temp').innerText = `${data.temp}°C`;
            } catch(e) {}
        }
        
        let lastPrice = 0;
        async function fetchBTC() {
            try {
                let res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
                let data = await res.json();
                let price = parseFloat(data.price);
                let priceEl = document.getElementById('btc-price');
                priceEl.innerText = `BTC/USDT: $${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                if (price > lastPrice && lastPrice !== 0) { priceEl.style.color = '#00ff00'; priceEl.style.textShadow = '0 0 25px rgba(0,255,0,0.4)'; }
                else if (price < lastPrice) { priceEl.style.color = '#ff3333'; priceEl.style.textShadow = '0 0 25px rgba(255,51,51,0.4)'; }
                lastPrice = price;
            } catch(e) {}
        }
        
        async function fetchFnG() {
            try {
                let res = await fetch('https://api.alternative.me/fng/?limit=1');
                let data = await res.json();
                document.getElementById('fng-index').innerText = `${data.data[0].value} (${data.data[0].value_classification})`;
            } catch(e) {}
        }

        async function fetchFleet() {
            try {
                let res = await fetch('/api/fleet');
                let fleet = await res.json();
                let htmlBots = '';
                let htmlTrades = '';
                let globalEquity = 0.0;
                
                for (const tf of ['5m', '15m', '1h', '4h', '1d']) {
                    const state = fleet[tf];
                    globalEquity += state.bank || 10000.0;
                    
                    let badgeClass = 'status-offline';
                    let badgeText = 'OFFLINE';
                    if (state.status === 'IN_TRADE') { badgeClass = 'status-active'; badgeText = 'IN TRADE'; }
                    else if (state.status === 'IDLE') { badgeClass = 'status-idle'; badgeText = 'IDLE'; }
                    
                    htmlBots += `
                        <div class="bot-card">
                            <div class="bot-header">
                                <span>[ ${tf} ALGO ]</span>
                                <span class="status-badge ${badgeClass}">${badgeText}</span>
                            </div>
                            <div class="bot-body">
                                <div class="row"><span class="label">Bankroll</span><span class="value val-green">$${state.bank ? state.bank.toLocaleString(undefined, {minimumFractionDigits: 2}) : '10,000.00'}</span></div>
                                <div class="row"><span class="label">Win Rate</span><span class="value">${state.win_rate ? state.win_rate.toFixed(1) : '0.0'}%</span></div>
                                <div class="row"><span class="label">Max DD</span><span class="value val-red">-${state.drawdown ? state.drawdown.toFixed(2) : '0.00'}%</span></div>
                                <div class="row"><span class="label">Position</span><span class="value ${state.position==='BUY'?'val-green':(state.position==='SELL'?'val-red':'')}">${state.position || 'NONE'}</span></div>
                                <div class="row"><span class="label">Entry</span><span class="value">${state.entry_price ? '$'+state.entry_price.toLocaleString() : '--'}</span></div>
                                <div class="row"><span class="label">Stop</span><span class="value">${state.stop_loss ? '$'+state.stop_loss.toLocaleString() : '--'}</span></div>
                                <div class="row"><span class="label">Invest</span><span class="value">${state.size_usd ? '$'+state.size_usd.toLocaleString() : '--'}</span></div>
                                <div class="row"><span class="label">Risk Exp.</span><span class="value">${state.risk_usd ? '$'+state.risk_usd.toLocaleString() : '--'}</span></div>
                            </div>
                        </div>
                    `;
                    
                    htmlTrades += `<div class="trade-card"><div class="trade-header">ÚLTIMOS TRADES (${tf})</div>`;
                    if (state.recent_trades && state.recent_trades.length > 0) {
                        let recent = state.recent_trades.slice().reverse();
                        for (let tr of recent) {
                            let type = tr.type.split(' ')[0];
                            let typeColor = type === 'COMPRA' ? 'val-green' : 'val-red';
                            let pnlText = tr.pnl ? (tr.pnl > 0 ? '+$' : '-$') + Math.abs(tr.pnl).toFixed(2) : '--';
                            let pnlColor = tr.pnl > 0 ? 'val-green' : (tr.pnl < 0 ? 'val-red' : '');
                            htmlTrades += `
                                <div class="trade-row">
                                    <span class="${typeColor}" style="width: 45px;">${type.substring(0,4)}</span>
                                    <span style="color:#aaa;">$${parseFloat(tr.price).toLocaleString()}</span>
                                    <span class="${pnlColor}">${pnlText}</span>
                                </div>
                            `;
                        }
                    } else {
                        htmlTrades += `<div style="text-align:center; color:#444; margin-top:20px; font-size:11px;">ESPERANDO SEÑAL...</div>`;
                    }
                    htmlTrades += `</div>`;
                }
                
                document.getElementById('fleet-grid').innerHTML = htmlBots;
                document.getElementById('trades-grid').innerHTML = htmlTrades;
                document.getElementById('global-equity').innerText = `$${globalEquity.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                
            } catch (e) {}
        }

        setInterval(fetchSystem, 5000);
        setInterval(fetchBTC, 2000);
        setInterval(fetchFleet, 5000);
        setInterval(fetchFnG, 600000); // 10 minutes for F&G
        
        fetchSystem();
        fetchBTC();
        fetchFleet();
        fetchFnG();
    </script>
</body>
</html>
